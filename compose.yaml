services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: evidence_lab
      POSTGRES_USER: evidence_lab
      POSTGRES_PASSWORD: evidence_lab
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evidence_lab -d evidence_lab"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
